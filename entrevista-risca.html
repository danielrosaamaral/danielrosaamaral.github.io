<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><meta name="description" content="Uma conversa de dois sentidos sobre a vaga de Responsável de Marketing & Comunicação."><title>Uma conversa em dois sentidos — Daniel × Risca</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--ink:#000;--muted:#454545;--blue:#0011ff;--line:#000;--bg:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Outfit,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}button,textarea,a{font:inherit}button{cursor:pointer}a{color:inherit}.shell{max-width:960px;margin:auto;padding:28px 30px 20px}.header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:15px;border-bottom:1px solid #000;margin-bottom:44px}.brand{font-size:15px;font-weight:600}.brand .x{padding:0 6px}.headernote{font-size:13px}.layout{display:block;max-width:760px;margin:0 auto}.sidebar{display:none}.card{border:0;padding:0;min-height:0;overflow:visible}.content{animation:enter .24s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 18px}h1,h2{margin:0 0 18px;letter-spacing:-.04em;font-weight:500;line-height:1.14;text-wrap:balance}h1{font-size:clamp(38px,5.4vw,60px)}h2{font-size:clamp(30px,4vw,44px)}.lead{font-size:18px;line-height:1.55;margin:0 0 14px;text-wrap:pretty;max-width:720px}.subtle{font-size:13px;line-height:1.5;color:var(--muted);text-wrap:pretty}.stats{display:flex;gap:18px;margin:25px 0 0;font-size:13px}.chip{border:0;border-radius:0;padding:0;background:none;color:#000;font-size:13px}.progress-header{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:0 0 9px}.track{height:2px;background:#ddd;border:0;overflow:hidden;margin-bottom:32px}.track i{display:block;height:100%;background:#000;transition:width .25s ease}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #000;border-radius:2px;padding:11px 17px;font-size:14px;font-weight:500;text-decoration:none;background:#fff;color:#000;transition:background .15s,color .15s,border-color .15s}.btn:hover,.btn:focus-visible{background:var(--blue);border-color:var(--blue);color:#fff}.btn:active{transform:translateY(1px)}.primary,.secondary,.textbtn{background:#fff;color:#000}.textbtn{border-color:transparent;text-decoration:underline;text-underline-offset:3px}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.answer-label{display:block;font-weight:500;font-size:14px;margin:26px 0 9px}.answer-label small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:3px}textarea{display:block;resize:vertical;min-height:130px;width:100%;padding:13px 14px;background:#fff;border:1px solid #000;border-radius:0;line-height:1.55;color:#000;font-size:16px}textarea:focus{outline:2px solid var(--blue);outline-offset:2px;border-color:var(--blue)}textarea::placeholder{color:#666;opacity:1}.error{color:#000;font-size:13px;font-weight:500;min-height:18px;margin-top:6px}.notice{border:0;padding:0;margin-top:22px;font-size:13px;line-height:1.5;color:var(--muted)}.saved{font-size:12px;color:var(--muted)}.review{padding:16px 0;border-bottom:1px solid #ddd}.reviewhead{display:flex;gap:12px;align-items:start;justify-content:space-between}.reviewhead strong{font-size:16px;font-weight:500}.review p{font-size:15px;line-height:1.55;white-space:pre-wrap;margin:8px 0 0}.edit{border:0;background:transparent;color:#000;font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:3px}.edit:hover{color:var(--blue)}.footer{display:flex;justify-content:space-between;gap:16px;color:#000;font-size:12px;margin:48px auto 0;max-width:760px;line-height:1.6}.footer a{text-decoration:none}.footer a:hover{color:var(--blue);text-decoration:underline}.game-dialog{position:fixed;inset:0;z-index:100;padding:0;border:0;background:#090909;width:100%;height:100%;max-width:none;max-height:none;margin:0;overflow:hidden}.game-dialog::backdrop{background:#090909}.game-frame{border:0;display:block;width:100%;height:100dvh;background:#090909}.hidden{display:none}@media(max-width:760px){.shell{padding:20px 18px}.header{margin-bottom:30px;padding-bottom:12px}.headernote{font-size:11px;text-align:right}.lead{font-size:16px}.stats{gap:12px;flex-wrap:wrap}.footer{margin-top:32px;flex-direction:column;gap:5px}h1{font-size:42px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="shell"><header class="header"><div class="brand">Daniel Amaral <span class="x">×</span> Risca</div><div class="headernote">Uma candidatura. Uma conversa.</div></header><div class="layout"><aside class="sidebar"><div class="round" id="icon">↗</div><div><h3 id="sideTitle">De Daniel para a Risca</h3><p id="sideText">Uma entrevista de dois sentidos.</p></div></aside><main class="card" id="app"></main></div><footer class="footer"><span>Daniel da Rosa Amaral · Designer de Comunicação</span><span><a href="https://danielrosaamaral.github.io/portfolio-2026-sumario-daniel-amaral.pdf" target="_blank" rel="noopener">Portefólio (PDF) ↗</a> &nbsp; · &nbsp; <a href="https://danielrosaamaral.github.io/" target="_blank" rel="noopener">Site ↗</a> &nbsp; · &nbsp; <a href="mailto:daniel.rosa.amaral@gmail.com">Contacto ↗</a></span></footer></div><dialog class="game-dialog" id="gameDialog" aria-label="Controlo de idade"><iframe class="game-frame" id="gameFrame" title="Jogo de controlo de idade" allow="autoplay" src="about:blank"></iframe></dialog><script>
'use strict';
const Q=[
{tag:'O ÂMBITO',title:'Quando dizem «todas», de quantas frentes estamos a falar?',context:'No anúncio falam das empresas do grupo e de clientes. Na prática, como se divide o trabalho entre a Matrem e os clientes da Risca?',placeholder:'Contem-me como funciona…'},
{tag:'O DESAFIO',title:'O que vos fez abrir esta posição agora?',context:'Há alguma coisa que esteja a ficar para trás? Ou uma oportunidade que queiram agarrar e que precise de mais mãos — e de mais cabeça?',placeholder:'O que está por trás da vaga?'},
{tag:'A EQUIPA',title:'Como se organiza a equipa e a tomada de decisões?',context:'Na minha experiência mais recente, coordenei equipas e projectos e acompanhei clientes. Para perceber melhor como esta função se integraria, gostava de saber que equipa existe actualmente, a quem reporta a posição, quem participa nas decisões e a quem cabe a decisão final.',placeholder:'Equipa, linha de reporte e tomada de decisões…'},
{tag:'AS PRIORIDADES',title:'Quando tudo é urgente, quem escolhe?',context:'Como definem prioridades e distribuem recursos entre projectos?',placeholder:'Como organizam o trabalho?'},
{tag:'AS CONDIÇÕES',title:'Condições da função',context:'Qual é o intervalo salarial previsto? Se a função tiver de ser no Porto, garantem alojamento ou apoio concreto à mudança? Tenho dois gatos, o Porto e o Pim; para me mudar, preciso de uma casa que nos aceite aos três.',placeholder:'Salário, contrato e condições de mudança…'},
{tag:'A LOCALIZAÇÃO',title:'Porto é a morada da equipa ou uma condição da função?',context:'Estou em Oeiras. Têm clientes ou planos em Lisboa que possam justificar uma presença da Risca por cá, articulada com o Porto? Quero perceber se há uma oportunidade real para o negócio.',placeholder:'Como vêem a localização e essa possibilidade?'},
{tag:'O RESULTADO',title:'Daqui a seis meses, o que gostariam de ver diferente?',context:'Se esta contratação correr bem, o que estará a funcionar melhor?',placeholder:'O que seria um bom resultado para a Risca?'}];
const KEY='risca-entrevista-daniel-v3', OLD_KEY='risca-entrevista-daniel-v2', app=document.querySelector('#app'); let step=-1,answers=Array(Q.length).fill(''),storageOK=false;
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(!saved){const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');if(old&&Array.isArray(old.answers)){const a=old.answers.slice();[a[4],a[5]]=[a[5],a[4]];saved={answers:a};localStorage.setItem(KEY,JSON.stringify(saved));localStorage.removeItem(OLD_KEY);}}if(saved&&Array.isArray(saved.answers)){answers=Q.map((_,i)=>typeof saved.answers[i]==='string'?saved.answers[i]:'');}storageOK=true}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers}));storageOK=true;return true}catch(e){storageOK=false;return false}}
function goto(n){step=n;draw();window.scrollTo({top:0,behavior:'auto'})}
function draw(){const icon=document.querySelector('#icon'),st=document.querySelector('#sideTitle'),sx=document.querySelector('#sideText');if(step<0){icon.textContent='↗';st.textContent='De Daniel para a Risca';sx.textContent='Designer de Comunicação.';const resumed=answers.some(x=>x.trim());app.innerHTML=`<div class="content"><p class="eyebrow">Uma conversa de dois sentidos</p><h1>Antes das respostas,<br>as perguntas certas.</h1><p class="lead">Olá, Risca. Li o vosso anúncio e fiquei com algumas perguntas. Achei que podíamos começar por elas.</p><p class="lead">Uma de cada vez: vocês contam-me como vêem o desafio; eu explico onde posso ajudar.</p><div class="stats"><span class="chip">7 perguntas</span><span class="chip">Respostas guardadas neste navegador</span></div><div class="actions"><button class="btn primary" id="start">${resumed?'Continuar a conversa':'Começar a conversa'} <span aria-hidden="true">↗</span></button>${resumed?'<button class="btn textbtn" id="reset">Começar de novo</button>':''}</div><p class="subtle">${storageOK?'As respostas ficam guardadas neste navegador até as apagarem.':'Este navegador não permite guardar automaticamente; concluam antes de fechar a página.'}</p></div>`;document.querySelector('#start').onclick=()=>goto(Math.max(0,answers.findIndex(a=>!a.trim())));let reset=document.querySelector('#reset');if(reset)reset.onclick=()=>{if(confirm('Apagar as respostas guardadas neste navegador e começar de novo?')){answers=Array(Q.length).fill('');try{localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY)}catch(e){}goto(0)}};return}
if(step<Q.length){let q=Q[step];icon.textContent=String(step+1).padStart(2,'0');st.textContent=q.tag.toLowerCase().replace(/^./,c=>c.toUpperCase());sx.textContent='Risca × Daniel.';app.innerHTML=`<div class="content"><div class="progress-header"><span>Pergunta ${step+1} de ${Q.length}</span><span class="saved" id="saved">${storageOK?'Guardado neste navegador':'Sem gravação automática'}</span></div><div class="track" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${step+1}"><i style="width:${100*(step+1)/Q.length}%"></i></div><p class="eyebrow">${q.tag}</p><h2>${q.title}</h2><p class="lead">${q.context}</p><label class="answer-label" for="answer"><span>A vossa resposta</span><small>Necessária para avançar</small></label><textarea id="answer" placeholder="${q.placeholder}" aria-describedby="error privacy" required></textarea><div id="error" class="error" role="status" aria-live="polite"></div><div class="actions"><button class="btn textbtn" id="back">← Voltar</button><button class="btn primary" id="next">${step===Q.length-1?'Rever respostas':'Continuar'} <span aria-hidden="true">→</span></button></div><p class="subtle" id="privacy">${storageOK?'Guardadas apenas neste dispositivo. Nada é enviado automaticamente.':'Não é possível guardar neste navegador. Não fechem a página antes de copiar ou enviar as respostas.'}</p></div>`;const t=document.querySelector('#answer');t.value=answers[step];t.oninput=()=>{answers[step]=t.value;const ok=save();document.querySelector('#saved').textContent=ok?'Guardado neste navegador':'Sem gravação automática';document.querySelector('#error').textContent=''};document.querySelector('#back').onclick=()=>goto(step-1);document.querySelector('#next').onclick=()=>{if(!t.value.trim()){document.querySelector('#error').textContent='Escrevam uma resposta para continuarmos.';t.setAttribute('aria-invalid','true');t.focus();return}t.removeAttribute('aria-invalid');save();goto(step+1)};return}
icon.textContent='✓';st.textContent='Quase lá';sx.textContent='Respostas da Risca.';const review=Q.map((q,i)=>`<div class="review"><div class="reviewhead"><strong>${String(i+1).padStart(2,'0')} · ${esc(q.title)}</strong><button class="edit" data-edit="${i}" aria-label="Editar resposta ${i+1}">Editar</button></div><p>${esc(answers[i])}</p></div>`).join('');app.innerHTML=`<div class="content"><p class="eyebrow"><span class="dot"></span> A conversa continua</p><h2>Obrigado pelo tempo e pelo interesse.</h2><p class="lead">Obrigado por terem chegado até aqui e dedicado tempo a esta conversa. O vosso interesse significa muito para mim. Espero que seja o início de uma boa conversa.</p><p class="lead">Revejam as respostas. Se quiserem mudar alguma coisa, basta tocar em «Editar».</p>${review}<div class="notice">As respostas ficam neste navegador; não são enviadas nem guardadas num servidor. O botão abre o vosso email com o texto preenchido. Revejam e enviem quando quiserem — ou copiem/descarreguem as respostas.</div><div class="actions"><a class="btn primary" id="mail">Abrir email com respostas ↗</a><button class="btn secondary" id="copy">Copiar</button><button class="btn secondary" id="download">Descarregar</button><button class="btn textbtn" id="clear">Apagar deste navegador</button></div><p class="subtle" id="message" role="status" aria-live="polite"></p></div>`;const body='Olá Daniel,\n\nAqui ficam as nossas respostas à entrevista:\n\n'+Q.map((q,i)=>`${i+1}. ${q.title}\n${answers[i]}`).join('\n\n')+'\n\nAté breve.';document.querySelector('#mail').href='mailto:daniel.rosa.amaral@gmail.com?subject='+encodeURIComponent('Risca — respostas à entrevista')+'&body='+encodeURIComponent(body);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>goto(Number(b.dataset.edit)));document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(body);document.querySelector('#message').textContent='Respostas copiadas.'}catch(e){document.querySelector('#message').textContent='Não foi possível copiar. Descarreguem as respostas ou seleccionem o texto acima.'}};document.querySelector('#download').onclick=()=>{let u=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='respostas-entrevista-risca.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.querySelector('#clear').onclick=()=>{if(confirm('Apagar todas as respostas guardadas neste navegador? Esta acção não pode ser desfeita.')){answers=Array(Q.length).fill('');try{localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY)}catch(e){}goto(-1)}}}
const gameDialog=document.getElementById('gameDialog'),gameFrame=document.getElementById('gameFrame');
gameDialog.addEventListener('close',()=>{gameFrame.src='about:blank';document.getElementById('start')?.focus()});
gameFrame.addEventListener('load',()=>{try{const overlay=gameFrame.contentDocument?.getElementById('game-overlay');if(!overlay)return;const observer=new MutationObserver(()=>{if(overlay.classList.contains('game-hidden')&&gameDialog.open){observer.disconnect();gameDialog.close()}});observer.observe(overlay,{attributes:true,attributeFilter:['class']});if(overlay.classList.contains('game-hidden')&&gameDialog.open){observer.disconnect();gameDialog.close()}}catch(e){}});
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===gameFrame.contentWindow&&event.data?.type==='risca-game-complete'&&gameDialog.open)gameDialog.close()});
draw();gameDialog.showModal();gameFrame.src='chuckie-risca.html';
</script></body></html>
