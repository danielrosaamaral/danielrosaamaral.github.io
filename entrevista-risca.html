<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="description" content="Uma conversa de dois sentidos sobre a vaga de Responsável de Marketing e Comunicação."><title>Antes de falarmos de respostas — Daniel × Risca</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--ink:#161715;--paper:#f1efe8;--acid:#d9f35a;--line:#c8c8bf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100svh}button,a,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:32px 32px 38px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:19px;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.12em;text-transform:uppercase}.brand{font-size:17px;letter-spacing:-.04em}.top span:nth-child(2){color:#62635d;text-align:right}.bar{height:3px;background:#d6d6cd}.bar i{display:block;background:#171815;width:0%;height:100%;transition:width .25s}.stage{display:grid;grid-template-columns:1fr 2fr;gap:50px;padding:70px 0 55px;min-height:590px}.rail{font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.12em;text-transform:uppercase}.rail .num{font-size:86px;letter-spacing:-.08em;line-height:1;margin:15px 0 12px}.rail .tiny{color:#777970;line-height:1.7}.eyebrow{font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}.tag{display:inline-block;background:var(--acid);padding:7px 10px}.main h1,.main h2{font:700 clamp(38px,6vw,68px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.055em;margin:0 0 22px}.main h2{font-size:clamp(31px,4.6vw,53px)}.lead{font-size:clamp(18px,2vw,21px);line-height:1.55;max-width:630px}.note{font-size:14px;color:#62635d;line-height:1.6;max-width:620px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}button.primary,a.primary{background:var(--ink);color:white;border:1px solid var(--ink);padding:16px 21px;display:inline-block;text-decoration:none;font-weight:700}button.primary:hover,a.primary:hover{background:#414438}button.secondary{background:transparent;border:1px solid var(--line);padding:15px 18px;color:var(--ink)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #668400;outline-offset:3px}label{display:block;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:32px 0 10px}textarea{width:100%;min-height:135px;background:#faf9f5;border:1px solid #9c9e94;border-radius:0;padding:15px;resize:vertical;line-height:1.5;color:var(--ink)}.error{color:#8e290e;font-size:14px;min-height:20px;margin:7px 0 0}.foot{border-top:1px solid var(--ink);padding-top:18px;display:flex;justify-content:space-between;gap:20px;color:#676962;font-size:12px;line-height:1.5}.foot a{color:inherit}.review{border-top:1px solid var(--line);padding:15px 0}.review b{font-family:'Space Grotesk',sans-serif}.review p{white-space:pre-wrap;line-height:1.55}.privacy{background:#e5e7d5;padding:15px;line-height:1.5;font-size:13px;margin-top:24px}@media(max-width:700px){.wrap{padding:22px 20px}.top{font-size:10px}.stage{display:block;min-height:auto;padding:45px 0}.rail{display:flex;gap:14px;align-items:center;margin-bottom:30px}.rail .num{font-size:45px;margin:0}.rail .tiny{line-height:1.4}.main h1{font-size:48px}.foot{flex-direction:column}}
</style></head><body><div class="wrap"><header class="top"><span class="brand">DANIEL AMARAL <span style="font-weight:400">×</span> RISCA</span><span>Responsável de Marketing & Comunicação<br>Uma conversa em duas direcções</span></header><div class="bar"><i id="progress"></i></div><main class="stage" id="app"></main><footer class="foot"><span>Uma candidatura de Daniel da Rosa Amaral.<br>Designer de Comunicação.</span><span><a href="https://danielrosaamaral.github.io/" target="_blank" rel="noopener">Portefólio ↗</a> &nbsp; <a href="mailto:daniel.rosa.amaral@gmail.com">Contacto ↗</a></span></footer></div>
<script>
'use strict';
const questions=[
 {tag:'01 / ÂMBITO',title:'Quando dizem «todas», de quantas frentes estamos a falar?',context:'No anúncio falam da comunicação das empresas do grupo e do acompanhamento de clientes. Como se divide, na prática, o trabalho entre as empresas da Matrem e os clientes da Risca?',placeholder:'A vossa resposta…'},
 {tag:'02 / O DESAFIO',title:'O que vos levou a abrir esta posição agora?',context:'Há alguma coisa que esteja a ficar para trás, uma oportunidade que queiram aproveitar ou uma forma de trabalhar que queiram mudar?',placeholder:'O que está por trás da vaga?'},
 {tag:'03 / EQUIPA',title:'Quem está à mesa — e quem decide?',context:'Na GATA, coordenei equipas e projectos e acompanhei clientes. Para perceber onde posso ajudar: que equipa existe, a quem reporta esta função e que decisões poderá tomar?',placeholder:'Equipa, articulação e autonomia…'},
 {tag:'04 / PRIORIDADES',title:'Quando tudo é urgente, quem escolhe?',context:'Uma pessoa pode ter várias prioridades; todas ao mesmo tempo é que já é um desporto. Como são definidos os objectivos e distribuídos os recursos entre projectos?',placeholder:'Como organizam prioridades e recursos?'},
 {tag:'05 / GEOGRAFIA',title:'Porto é a morada da equipa ou uma condição da função?',context:'Estou em Oeiras. A Risca tem clientes ou ambições em Lisboa que possam justificar uma presença cá, articulada com o Porto? Não estou a propor um escritório por decreto — gostava de perceber se existe uma oportunidade real.',placeholder:'Como vêem a localização e esta possibilidade?'},
 {tag:'06 / CONDIÇÕES',title:'Vamos à parte pouco criativa. Mas decisiva.',context:'Qual é o intervalo salarial previsto? Se a função tiver mesmo de ser no Porto, garantem alojamento ou apoio concreto à mudança? Tenho dois gatos, o Porto e o Pim; preciso de uma solução habitacional que aceite os dois.',placeholder:'Remuneração, tipo de contrato e condições de mudança…'},
 {tag:'07 / O RESULTADO',title:'Daqui a seis meses, o que gostariam de ver diferente?',context:'Se esta contratação correr mesmo bem, o que é que estará a funcionar melhor? Gosto de saber para onde vamos antes de começarmos a correr.',placeholder:'O que seria um bom resultado para a Risca?'}
];
let step=-1, answers=Array(questions.length).fill(''); const app=document.querySelector('#app'),progress=document.querySelector('#progress');
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){progress.style.width=(step<0?0:step>=questions.length?100:Math.round((step/questions.length)*100))+'%'; if(step<0){app.innerHTML=`<aside class="rail"><span class="num">↗</span><span class="tiny">CANDIDATURA<br>PORTO · LISBOA</span></aside><section class="main"><div class="eyebrow"><span class="tag">ANTES DE FALARMOS DE RESPOSTAS</span></div><h1>Uma entrevista.<br>Nos dois sentidos.</h1><p class="lead">Olá, Risca. Sou o Daniel. Li o vosso anúncio e fiquei com algumas perguntas. Não é um interrogatório — prometo que não há candeeiro apontado à cara.</p><p class="lead">A ideia é simples: uma pergunta de cada vez. Vocês respondem, eu fico a perceber melhor o desafio. E, com sorte, já chegamos à conversa com uma boa parte do briefing feito.</p><p class="note">São ${questions.length} perguntas. No fim podem rever as respostas e escolher enviá-las por email. Nada é enviado automaticamente.</p><div class="actions"><button class="primary" id="start">Começar a conversa ↗</button></div></section>`;document.querySelector('#start').onclick=()=>{step=0;draw()};return;}
if(step<questions.length){let q=questions[step];app.innerHTML=`<aside class="rail"><span class="num">${String(step+1).padStart(2,'0')}</span><span class="tiny">DE ${String(questions.length).padStart(2,'0')}<br>É A VOSSA VEZ.</span></aside><section class="main"><div class="eyebrow"><span class="tag">${q.tag}</span></div><h2>${q.title}</h2><p class="lead">${q.context}</p><label for="answer">A resposta da Risca</label><textarea id="answer" placeholder="${q.placeholder}" required></textarea><div class="error" id="error" role="status" aria-live="polite"></div><div class="actions"><button class="secondary" id="back">← Voltar</button><button class="primary" id="next">${step===questions.length-1?'Rever respostas':'Continuar'} ↗</button></div><p class="note">As respostas ficam neste navegador até serem enviadas. Não são guardadas num servidor.</p></section>`;let answer=document.querySelector('#answer');answer.value=answers[step];answer.addEventListener('input',()=>{answers[step]=answer.value;document.querySelector('#error').textContent=''});document.querySelector('#back').onclick=()=>{answers[step]=answer.value;step--;draw()};document.querySelector('#next').onclick=()=>{if(!answer.value.trim()){document.querySelector('#error').textContent='Escrevam uma resposta para continuar.';answer.focus();return}answers[step]=answer.value;step++;draw();window.scrollTo(0,0)};return;}
let review=questions.map((q,i)=>`<div class="review"><b>${String(i+1).padStart(2,'0')} — ${escapeHTML(q.title)}</b><p>${escapeHTML(answers[i])}</p></div>`).join('');app.innerHTML=`<aside class="rail"><span class="num">✓</span><span class="tiny">FIM DA PRIMEIRA<br>PARTE</span></aside><section class="main"><div class="eyebrow"><span class="tag">AGORA SIM, CONVERSAMOS</span></div><h2>Obrigado. Agora já temos por onde começar.</h2><p class="lead">Podem rever as respostas e voltar atrás para alterar o que quiserem. O envio só acontece se escolherem fazê-lo.</p>${review}<div class="privacy">As respostas não são enviadas automaticamente nem ficam armazenadas no GitHub. O botão de email abre a vossa aplicação de correio com o texto preenchido; revejam-no antes de enviar. Se preferirem, podem copiar as respostas.</div><div class="actions"><button class="secondary" id="back">← Alterar respostas</button><a class="primary" id="mail">Abrir email com respostas ↗</a><button class="secondary" id="copy">Copiar respostas</button><button class="secondary" id="download">Descarregar respostas</button></div><p class="note" id="copymsg" role="status"></p></section>`;
let body='Olá Daniel,\n\nAqui ficam as nossas respostas à entrevista:\n\n'+questions.map((q,i)=>`${i+1}. ${q.title}\n${answers[i]}`).join('\n\n')+'\n\nAté breve.';document.querySelector('#mail').href='mailto:daniel.rosa.amaral@gmail.com?subject='+encodeURIComponent('Risca — respostas à entrevista')+'&body='+encodeURIComponent(body);document.querySelector('#back').onclick=()=>{step=questions.length-1;draw();window.scrollTo(0,0)};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(body);document.querySelector('#copymsg').textContent='Respostas copiadas.'}catch(e){document.querySelector('#copymsg').textContent='Não foi possível copiar. Podem seleccionar o texto acima ou descarregar o ficheiro.'}};document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='respostas-entrevista-risca.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};}
draw();
</script></body></html>
