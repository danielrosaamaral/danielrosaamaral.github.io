<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><meta name="description" content="Uma conversa de dois sentidos sobre a vaga de Responsável de Marketing & Comunicação."><title>Uma conversa em dois sentidos — Daniel × Risca</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--ink:#000;--muted:#414141;--blue:#0011ff;--surface:#fff;--line:#000;--bg:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Outfit,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}button,textarea,a{font:inherit}button{cursor:pointer}a{color:inherit}a:hover,a:focus-visible{color:var(--blue)}.shell{max-width:1140px;padding:30px 30px 22px;margin:auto}.header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:48px}.brand{font-size:15px;font-weight:600;letter-spacing:-.02em}.brand .x{color:#000;padding:0 7px}.headernote{font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:240px minmax(0,690px);gap:65px;justify-content:center;align-items:start}.sidebar{padding-top:28px}.round{display:grid;place-items:center;width:48px;height:48px;border:1.5px solid #000;border-radius:50%;background:#fff;color:#000;font-weight:700;font-size:21px;margin-bottom:22px}.sidebar h3{font-size:18px;margin:0 0 8px;font-weight:600}.sidebar p{color:var(--muted);font-size:14px;line-height:1.55;margin:0}.card{position:relative;background:#fff;border:1.5px solid #000;border-radius:0;padding:48px;min-height:460px;overflow:hidden}.content{animation:enter .34s cubic-bezier(.2,.7,.25,1) both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;color:#000;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0 0 16px}.eyebrow .dot{display:inline-block;width:7px;height:7px;border:1px solid #000;border-radius:50%;background:transparent;margin-right:7px;vertical-align:2px}h1,h2{margin:0 0 18px;letter-spacing:-.045em;font-weight:600;line-height:1.09;text-wrap:balance}h1{font-size:clamp(38px,5vw,58px)}h2{font-size:clamp(30px,3.7vw,42px)}.lead{font-size:18px;line-height:1.55;color:#000;margin:0 0 15px;text-wrap:pretty}.subtle{font-size:14px;line-height:1.55;color:var(--muted);text-wrap:pretty}.stats{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0}.chip{border:1px solid #000;border-radius:99px;padding:8px 12px;background:#fff;color:#000;font-size:13px}.progress-header{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:0 0 10px}.track{height:5px;border:1px solid #000;background:#fff;overflow:hidden;margin-bottom:34px}.track i{display:block;height:100%;background:#000;transition:width .3s ease}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid #000;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:600;text-decoration:none;background:#fff;color:#000;transition:transform .16s,color .16s,background-color .16s,border-color .16s}.btn:hover{transform:translateY(-2px);background:var(--blue);border-color:var(--blue);color:#fff}.btn:active{transform:scale(.97)}.primary,.secondary,.textbtn{background:#fff;color:#000}.edit{border:0;background:transparent;color:#000;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}.edit:hover{color:var(--blue)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.answer-label{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;margin:29px 0 10px}.answer-label small{color:var(--muted);font-size:12px;font-weight:400}textarea{display:block;resize:vertical;min-height:144px;width:100%;padding:16px 18px;background:#fff;border:1.5px solid #000;border-radius:0;line-height:1.55;transition:border-color .2s,outline-color .2s;color:#000;font-size:16px}textarea:focus{outline:2px solid var(--blue);outline-offset:2px;border-color:var(--blue)}textarea::placeholder{color:#666;opacity:1}.error{color:#000;font-size:13px;font-weight:600;min-height:19px;margin-top:7px}.notice{border:1px solid #000;border-radius:0;background:#fff;padding:15px 17px;color:#000;font-size:13px;line-height:1.5;margin-top:24px}.saved{font-size:12px;color:var(--muted)}.review{padding:18px 0;border-bottom:1px solid #000}.reviewhead{display:flex;gap:12px;align-items:start;justify-content:space-between}.reviewhead strong{font-size:16px}.review p{font-size:15px;line-height:1.55;white-space:pre-wrap;color:#000;margin:9px 0 0}.footer{display:flex;justify-content:space-between;gap:20px;color:#000;font-size:12px;margin:42px auto 0;max-width:995px;line-height:1.6}.footer a{text-decoration:none}.footer a:hover{text-decoration:underline}.game-dialog{position:fixed;inset:0;z-index:100;padding:0;border:0;background:#fff;width:100%;height:100%;max-width:none;max-height:none}.game-dialog::backdrop{background:#000}.game-top{height:60px;padding:10px 20px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #000;gap:12px}.game-top span{font-weight:600}.game-top button{padding:7px 14px}.game-frame{border:0;display:block;width:100%;height:calc(100% - 60px);background:#000}.hidden{display:none}@media(max-width:760px){.shell{padding:22px 16px}.header{margin-bottom:26px}.headernote{font-size:11px;text-align:right}.layout{display:block}.sidebar{display:flex;align-items:center;gap:12px;padding:0;margin-bottom:18px}.round{width:38px;height:38px;font-size:16px;margin:0}.sidebar h3{font-size:14px;margin:0}.sidebar p{font-size:12px}.card{padding:33px 22px;min-height:auto}.lead{font-size:16px}.footer{margin-top:27px;flex-direction:column;gap:8px}h1{font-size:43px}.game-top{padding:8px 12px}.game-top span{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="shell"><header class="header"><div class="brand">Daniel Amaral <span class="x">×</span> Risca</div><div class="headernote">Uma candidatura. Uma conversa.</div></header><div class="layout"><aside class="sidebar"><div class="round" id="icon">↗</div><div><h3 id="sideTitle">De Daniel para a Risca</h3><p id="sideText">Uma entrevista de dois sentidos.</p></div></aside><main class="card" id="app"></main></div><footer class="footer"><span>Daniel da Rosa Amaral · Designer de Comunicação</span><span><a href="https://danielrosaamaral.github.io/portfolio-2026-sumario-daniel-amaral.pdf" target="_blank" rel="noopener">Portefólio (PDF) ↗</a> &nbsp; · &nbsp; <a href="https://danielrosaamaral.github.io/" target="_blank" rel="noopener">Site ↗</a> &nbsp; · &nbsp; <a href="mailto:daniel.rosa.amaral@gmail.com">Contacto ↗</a></span></footer></div><dialog class="game-dialog" id="gameDialog" aria-label="Jogar Chuckie Egg"><div class="game-top"><span>Um pequeno intervalo · Chuckie Egg</span><button class="btn secondary" id="closeGame" type="button">Saltar e ir à entrevista →</button></div><iframe class="game-frame" id="gameFrame" title="Jogo Chuckie Egg do site de Daniel Amaral" allow="autoplay" src="about:blank"></iframe></dialog><script>
'use strict';
const Q=[
{tag:'O ÂMBITO',title:'Quando dizem «todas», de quantas frentes estamos a falar?',context:'No anúncio falam das empresas do grupo e de clientes. Na prática, como se divide o trabalho entre a Matrem e os clientes da Risca?',placeholder:'Contem-me como funciona…'},
{tag:'O DESAFIO',title:'O que vos fez abrir esta posição agora?',context:'Há alguma coisa que esteja a ficar para trás? Ou uma oportunidade que queiram agarrar e que precise de mais mãos — e de mais cabeça?',placeholder:'O que está por trás da vaga?'},
{tag:'A EQUIPA',title:'Quem está à mesa — e quem decide?',context:'Na GATA coordenei equipas e projectos, acompanhei clientes e participei na gestão da agência. Que equipa existe hoje, a quem reporta esta função e que decisões pode tomar?',placeholder:'Equipa, articulação e autonomia…'},
{tag:'AS PRIORIDADES',title:'Quando tudo é urgente, quem escolhe?',context:'Uma pessoa pode ter várias prioridades. Todas ao mesmo tempo já é mais complicado. Como definem objectivos e distribuem recursos entre projectos?',placeholder:'Como organizam o trabalho?'},
{tag:'A LOCALIZAÇÃO',title:'Porto é a morada da equipa ou uma condição da função?',context:'Estou em Oeiras. Têm clientes ou planos em Lisboa que possam justificar uma presença da Risca por cá, articulada com o Porto? Não proponho abrir um escritório amanhã; gostava de perceber se há uma oportunidade real.',placeholder:'Como vêem a localização e essa possibilidade?'},
{tag:'AS CONDIÇÕES',title:'Agora a parte menos criativa. E bastante importante.',context:'Qual é o intervalo salarial previsto? Se a função tiver de ser no Porto, garantem alojamento ou apoio concreto à mudança? Tenho dois gatos, o Porto e o Pim; preciso de uma casa que aceite os dois.',placeholder:'Salário, contrato e condições de mudança…'},
{tag:'O RESULTADO',title:'Daqui a seis meses, o que gostariam de ver diferente?',context:'Se esta contratação correr bem, o que estará a funcionar melhor? Gosto de saber para onde vamos antes de começarmos a correr.',placeholder:'O que seria um bom resultado para a Risca?'}];
const KEY='risca-entrevista-daniel-v2', app=document.querySelector('#app'); let step=-1,answers=Array(Q.length).fill(''),storageOK=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.answers)){answers=Q.map((_,i)=>typeof saved.answers[i]==='string'?saved.answers[i]:'');}storageOK=true}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers}));storageOK=true;return true}catch(e){storageOK=false;return false}}
function goto(n){step=n;draw();window.scrollTo({top:0,behavior:'auto'})}
function draw(){const icon=document.querySelector('#icon'),st=document.querySelector('#sideTitle'),sx=document.querySelector('#sideText');if(step<0){icon.textContent='↗';st.textContent='De Daniel para a Risca';sx.textContent='Uma entrevista de dois sentidos.';const resumed=answers.some(x=>x.trim());app.innerHTML=`<div class="content"><p class="eyebrow"><span class="dot"></span> Uma conversa de dois sentidos</p><h1>Antes das respostas,<br>as perguntas certas.</h1><p class="lead">Olá, Risca. Sou o Daniel. Li o vosso anúncio e fiquei curioso. Então pensei: porque não começarmos a conversa por aqui?</p><p class="lead">Uma pergunta de cada vez. Vocês contam-me como vêem o desafio; eu fico a perceber onde posso ajudar. E sem candeeiro de interrogatório, prometo.</p><div class="stats"><span class="chip">7 perguntas</span><span class="chip">Ao vosso ritmo</span><span class="chip">Enviam só quando quiserem</span></div><div class="actions"><button class="btn primary" id="start">${resumed?'Continuar a conversa':'Começar a conversa'} <span aria-hidden="true">↗</span></button>${resumed?'<button class="btn textbtn" id="reset">Começar de novo</button>':''}</div><p class="subtle">${storageOK?'As respostas ficam guardadas neste navegador até as apagarem.':'Este navegador não permite guardar automaticamente; concluam antes de fechar a página.'}</p></div>`;document.querySelector('#start').onclick=()=>goto(Math.max(0,answers.findIndex(a=>!a.trim())));let reset=document.querySelector('#reset');if(reset)reset.onclick=()=>{if(confirm('Apagar as respostas guardadas neste navegador e começar de novo?')){answers=Array(Q.length).fill('');try{localStorage.removeItem(KEY)}catch(e){}goto(0)}};return}
if(step<Q.length){let q=Q[step];icon.textContent=String(step+1).padStart(2,'0');st.textContent=q.tag.toLowerCase().replace(/^./,c=>c.toUpperCase());sx.textContent='Uma pergunta de cada vez.';app.innerHTML=`<div class="content"><div class="progress-header"><span>Pergunta ${step+1} de ${Q.length}</span><span class="saved" id="saved">${storageOK?'Guardado neste navegador':'Sem gravação automática'}</span></div><div class="track" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${step+1}"><i style="width:${100*(step+1)/Q.length}%"></i></div><p class="eyebrow">${q.tag}</p><h2>${q.title}</h2><p class="lead">${q.context}</p><label class="answer-label" for="answer"><span>A vossa resposta</span><small>Necessária para avançar</small></label><textarea id="answer" placeholder="${q.placeholder}" aria-describedby="error privacy" required></textarea><div id="error" class="error" role="status" aria-live="polite"></div><div class="actions"><button class="btn textbtn" id="back">← Voltar</button><button class="btn primary" id="next">${step===Q.length-1?'Rever respostas':'Continuar'} <span aria-hidden="true">→</span></button></div><p class="subtle" id="privacy">${storageOK?'Guardadas apenas neste dispositivo. Nada é enviado automaticamente.':'Não é possível guardar neste navegador. Não fechem a página antes de copiar ou enviar as respostas.'}</p></div>`;const t=document.querySelector('#answer');t.value=answers[step];t.oninput=()=>{answers[step]=t.value;const ok=save();document.querySelector('#saved').textContent=ok?'Guardado neste navegador':'Sem gravação automática';document.querySelector('#error').textContent=''};document.querySelector('#back').onclick=()=>goto(step-1);document.querySelector('#next').onclick=()=>{if(!t.value.trim()){document.querySelector('#error').textContent='Escrevam uma resposta para continuarmos.';t.setAttribute('aria-invalid','true');t.focus();return}t.removeAttribute('aria-invalid');save();goto(step+1)};return}
icon.textContent='✓';st.textContent='Quase lá';sx.textContent='Rever antes de enviar.';const review=Q.map((q,i)=>`<div class="review"><div class="reviewhead"><strong>${String(i+1).padStart(2,'0')} · ${esc(q.title)}</strong><button class="edit" data-edit="${i}" aria-label="Editar resposta ${i+1}">Editar</button></div><p>${esc(answers[i])}</p></div>`).join('');app.innerHTML=`<div class="content"><p class="eyebrow"><span class="dot"></span> A conversa continua</p><h2>Obrigado. Agora já temos por onde começar.</h2><p class="lead">Revejam as respostas. Se quiserem mudar alguma coisa, basta tocar em «Editar».</p>${review}<div class="notice">As respostas ficam neste navegador; não são enviadas nem guardadas num servidor. O botão abre o vosso email com o texto preenchido. Revejam e enviem quando quiserem — ou copiem/descarreguem as respostas.</div><div class="actions"><a class="btn primary" id="mail">Abrir email com respostas ↗</a><button class="btn secondary" id="copy">Copiar</button><button class="btn secondary" id="download">Descarregar</button><button class="btn textbtn" id="clear">Apagar deste navegador</button></div><p class="subtle" id="message" role="status" aria-live="polite"></p></div>`;const body='Olá Daniel,\n\nAqui ficam as nossas respostas à entrevista:\n\n'+Q.map((q,i)=>`${i+1}. ${q.title}\n${answers[i]}`).join('\n\n')+'\n\nAté breve.';document.querySelector('#mail').href='mailto:daniel.rosa.amaral@gmail.com?subject='+encodeURIComponent('Risca — respostas à entrevista')+'&body='+encodeURIComponent(body);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>goto(Number(b.dataset.edit)));document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(body);document.querySelector('#message').textContent='Respostas copiadas.'}catch(e){document.querySelector('#message').textContent='Não foi possível copiar. Descarreguem as respostas ou seleccionem o texto acima.'}};document.querySelector('#download').onclick=()=>{let u=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='respostas-entrevista-risca.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.querySelector('#clear').onclick=()=>{if(confirm('Apagar todas as respostas guardadas neste navegador? Esta acção não pode ser desfeita.')){answers=Array(Q.length).fill('');try{localStorage.removeItem(KEY)}catch(e){}goto(-1)}}}
const gameDialog=document.getElementById('gameDialog'),gameFrame=document.getElementById('gameFrame');
document.getElementById('closeGame').onclick=()=>gameDialog.close();
gameDialog.addEventListener('close',()=>{gameFrame.src='about:blank';document.getElementById('start')?.focus()});
gameFrame.addEventListener('load',()=>{try{const overlay=gameFrame.contentDocument?.getElementById('game-overlay');if(!overlay)return;const observer=new MutationObserver(()=>{if(overlay.classList.contains('game-hidden')&&gameDialog.open){observer.disconnect();gameDialog.close()}});observer.observe(overlay,{attributes:true,attributeFilter:['class']});if(overlay.classList.contains('game-hidden')&&gameDialog.open){observer.disconnect();gameDialog.close()}}catch(e){}});
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===gameFrame.contentWindow&&event.data?.type==='risca-game-complete'&&gameDialog.open)gameDialog.close()});
draw();gameDialog.showModal();gameFrame.src='chuckie-risca.html';
</script></body></html>
