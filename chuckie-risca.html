</style></head><body><div id="game-overlay"><button class="skip" type="button" onclick="skipGame()">Saltar jogo →</button><div id="disclaimer-screen" class="screen"><div class="intro"><h1>Controlo de idade</h1><p>Se não reconhecem este jogo, é provavelmente porque são mais novos do que eu.</p><p class="note">Setas para andar e subir. Espaço para saltar.</p><button class="start" type="button" onclick="startChuckieGame()">Jogar →</button></div></div><div id="game-screen" class="hidden"><div class="canvas-wrap"><canvas id="chuckieCanvas"></canvas></div><p class="guide">Setas para andar e subir · Espaço para saltar · Prime Enter para reiniciar</p><div class="controls" id="game-controls" hidden><div class="pad" aria-label="Controlos de movimento"><button class="up" data-key="ArrowUp" aria-label="Subir">↑</button><button class="left" data-key="ArrowLeft" aria-label="Esquerda">←</button><button class="down" data-key="ArrowDown" aria-label="Descer">↓</button><button class="right" data-key="ArrowRight" aria-label="Direita">→</button></div><button class="jump" data-key="Space" aria-label="Saltar">SALTAR</button></div></div></div><script>
const C_GREEN='#00CC00',C_MAGENTA='#FF00FF',C_CYAN='#00FFFF',C_YELLOW='#FFFF00',C_WHITE='#FFFFFF',C_RED='#FF0000',C_BLUE='#0033FF';let audioCtx=null,isMuted=true,bgmTimer=null,animationFrameId=null;
function transitionToVideo(){stopBGM();if(animationFrameId)cancelAnimationFrame(animationFrameId);document.getElementById('game-overlay').classList.add('game-hidden');try{window.parent.postMessage({type:'risca-game-complete'},location.origin)}catch(e){}}function skipGame(){transitionToVideo()}
        /* SISTEMA DE ÁUDIO DO JOGO RETRO */
        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {}

        function playTone(freq, duration, type = 'square', volume = 0.08) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playJumpSound() {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e){}
        }

        function playEggSound() {
            playTone(987, 0.07, 'square', 0.1);
            setTimeout(() => playTone(1318, 0.09, 'square', 0.1), 70);
        }

        function playStepSound() {
            playTone(220, 0.03, 'triangle', 0.04);
        }

        function playHitSound() {
            if (!isMuted && navigator.vibrate) {
                try { navigator.vibrate([200, 50, 100]); } catch(e){}
            }
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch(e){}
        }

        function playWinSound() {
            if (!isMuted && navigator.vibrate) {
                try { navigator.vibrate([100, 50, 100, 50, 200]); } catch(e){}
            }
            const notes = [523, 659, 784, 1046, 1318];
            notes.forEach((freq, idx) => {
                setTimeout(() => playTone(freq, 0.12, 'square', 0.1), idx * 120);
            });
        }

        function startBGM() {
            if (isMuted || bgmTimer) return;
            initAudio();
            const bgmNotes = [
                261, 293, 329, 349, 392, 349, 329, 293,
                329, 349, 392, 440, 493, 440, 392, 349
            ];
            let noteIdx = 0;
            bgmTimer = setInterval(() => {
                if (!isMuted && audioCtx) {
                    playTone(bgmNotes[noteIdx], 0.1, 'square', 0.025);
                }
                noteIdx = (noteIdx + 1) % bgmNotes.length;
            }, 220);
        }

        function stopBGM() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        const keys = {};

        window.addEventListener('keydown', e => { 
            initAudio();
            if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
            keys[e.code] = true; 
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });
        window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);document.querySelectorAll('[data-key]').forEach(b=>b.classList.remove('pressed'))});

        function startChuckieGame() {
            initAudio();
            startBGM();

            document.getElementById('disclaimer-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            document.getElementById('game-controls').hidden=false;
            initCircularControls();
            initChuckieEgg();
        }

        function initCircularControls() {
          const buttons=document.querySelectorAll('[data-key]');
          buttons.forEach(b=>{const key=b.dataset.key;const down=e=>{e.preventDefault();initAudio();keys[key]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();keys[key]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
        }
        function updateMobileControlUI() {}

        function drawBitmap(ctx, x, y, bitmap, bitsPerRow, scale, color) {
            ctx.fillStyle = color;
            for (let r = 0; r < bitmap.length; r++) {
                let rowVal = bitmap[r];
                for (let c = 0; c < bitsPerRow; c++) {
                    if ((rowVal & (1 << (bitsPerRow - 1 - c))) !== 0) {
                        ctx.fillRect(Math.round(x + c * scale), Math.round(y + r * scale), Math.ceil(scale), Math.ceil(scale));
                    }
                }
            }
        }

        /* GAIOLA E PÁSSARO RETRO (CHUCKIE EGG) */
        function drawExactBirdcage(ctx, x, y, scale) {
            ctx.save();
            const px = Math.max(1, Math.round(scale * 1.4));
            
            let loopTime = (Date.now() % 2000) / 2000;
            let isBlinking = (loopTime > 0.40 && loopTime < 0.52);
            let isFlapping = (loopTime > 0.65 && loopTime < 0.85);
            let breatheY = (Math.sin(loopTime * Math.PI * 2) > 0) ? 0 : -px;

            const cageW = 28 * px;
            const cageH = 29 * px;
            const baseLineY = y + cageH;

            ctx.fillStyle = C_YELLOW;
            ctx.fillRect(x + 12 * px, y - 4 * px, 4 * px, 1 * px);
            ctx.fillRect(x + 11 * px, y - 3 * px, 2 * px, 2 * px);
            ctx.fillRect(x + 15 * px, y - 3 * px, 2 * px, 2 * px);
            ctx.fillRect(x + 12 * px, y - 1 * px, 4 * px, 1 * px);

            ctx.fillRect(x + 10 * px, y, 8 * px, 2 * px);
            ctx.fillRect(x + 6 * px, y + 2 * px, 16 * px, 2 * px);
            ctx.fillRect(x + 3 * px, y + 4 * px, 22 * px, 2 * px);
            ctx.fillRect(x + 1 * px, y + 6 * px, 26 * px, 2 * px);

            ctx.fillRect(x - 1 * px, baseLineY, cageW + 2 * px, 3 * px);
            ctx.fillStyle = C_RED;
            ctx.fillRect(x, baseLineY + 3 * px, cageW, 1 * px);

            ctx.fillStyle = C_YELLOW;
            ctx.fillRect(x, y + 8 * px, 2 * px, cageH - 8 * px);
            ctx.fillRect(x + cageW - 2 * px, y + 8 * px, 2 * px, cageH - 8 * px);

            const barPositions = [5, 9, 13, 17, 21];
            for (let i = 0; i < barPositions.length; i++) {
                let bx = x + barPositions[i] * px;
                ctx.fillRect(bx, y + 6 * px, 1 * px, cageH - 6 * px);
            }

            ctx.fillRect(x, y + 8 * px, cageW, 1 * px);
            ctx.fillRect(x, y + 18 * px, cageW, 1 * px);

            ctx.fillStyle = C_CYAN;
            ctx.fillRect(x + 18 * px, y + 9 * px, 8 * px, 1 * px);
            ctx.fillRect(x + 18 * px, y + 9 * px, 1 * px, 17 * px);
            ctx.fillRect(x + 18 * px, y + 26 * px, 8 * px, 1 * px);

            ctx.fillStyle = C_WHITE;
            ctx.fillRect(x + 25 * px, y + 12 * px, 2 * px, 2 * px);
            ctx.fillRect(x + 25 * px, y + 21 * px, 2 * px, 2 * px);
            ctx.fillRect(x + 17 * px, y + 17 * px, 2 * px, 3 * px);

            let birdX = x + 3.5 * px;
            let birdY = y + 8.5 * px + breatheY;
            let spriteScale = px * 0.88;

            drawBitmap(ctx, birdX, birdY, SKOOL_SPRITES.mother_duck, 24, spriteScale, C_YELLOW);

            let eyeX = birdX + Math.round(15 * spriteScale);
            let eyeY = birdY + Math.round(3 * spriteScale);
            let eyeSize = Math.max(2, Math.round(2 * spriteScale));

            if (isBlinking) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(eyeX - 1, eyeY, eyeSize + 2, 1 * px);
            } else {
                ctx.fillStyle = '#000000';
                ctx.fillRect(eyeX, eyeY, eyeSize, eyeSize);
                ctx.fillStyle = C_WHITE;
                ctx.fillRect(eyeX, eyeY, Math.max(1, Math.floor(eyeSize / 2)), Math.max(1, Math.floor(eyeSize / 2)));
            }

            if (isFlapping) {
                ctx.fillStyle = C_YELLOW;
                let wingX = birdX + Math.round(4 * spriteScale);
                let wingY = birdY + Math.round(7 * spriteScale) - 2 * px;
                ctx.fillRect(wingX, wingY, 7 * px, 3 * px);
                ctx.fillRect(wingX + 1 * px, wingY - 1 * px, 5 * px, 1 * px);
            }

            ctx.restore();
        }

            function drawPlatform(x, y, w) {
                let thickness = Math.round(16 * gfxScale);
                ctx.fillStyle = C_GREEN;
                ctx.fillRect(x, y, w, thickness);
                
                ctx.fillStyle = '#000000';
                let blockW = Math.round(12 * gfxScale);
                let blockH = Math.round(3 * gfxScale);
                for(let i = 0; i < w; i += blockW) {
                    ctx.fillRect(x + i, y + Math.round(2 * gfxScale), Math.round(6 * gfxScale), blockH);
                    ctx.fillRect(x + i + Math.round(3 * gfxScale), y + Math.round(9 * gfxScale), Math.round(6 * gfxScale), blockH);
                }

                let capW = Math.max(2, Math.round(3 * gfxScale));
                ctx.fillStyle = C_WHITE;
                ctx.fillRect(x, y, capW, thickness);
                ctx.fillRect(x + w - capW, y, capW, thickness);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + capW, y, 1, thickness);
                ctx.fillRect(x + w - capW - 1, y, 1, thickness);
            }

            function drawLadder(x, y, h) {
                let ladderWidth = Math.round(20 * gfxScale);
                let railWidth = Math.max(2, Math.round(4 * gfxScale));
                ctx.fillStyle = C_MAGENTA;
                ctx.fillRect(x, y, railWidth, h); 
                ctx.fillRect(x + ladderWidth - railWidth, y, railWidth, h);
                
                let stepHeight = Math.round(8 * gfxScale);
                let stepBarH = Math.max(2, Math.round(4 * gfxScale));
                for(let i = y + Math.round(4 * gfxScale); i < y + h; i += stepHeight) { 
                    ctx.fillRect(x + railWidth, i, ladderWidth - (railWidth * 2), stepBarH); 
                }
            }

            function drawOstrich(o) {
                ctx.save();
                let bitScale = (o.w / 16);
                let frameIdx = Math.floor(Date.now() / 100) % 2;
                
                let scaleX = 1.0;
                let scaleY = 1.0;
                if (o.state === 'turning') {
                    scaleX = 0.75;
                    scaleY = 1.05;
                }

                ctx.translate(o.x + o.w / 2, o.y + o.h);
                if (o.tiltAngle) {
                    ctx.rotate(o.tiltAngle);
                }
                ctx.scale(scaleX, scaleY);
                ctx.translate(-(o.x + o.w / 2), -(o.y + o.h));

                if (o.eatingTimer > 0) {
                    let currentFrame = SKOOL_SPRITES.duck_right[frameIdx];
                    drawBitmap(ctx, o.x, o.y, currentFrame, 16, bitScale, C_YELLOW);
                } else if (o.state === 'climbing') {
                    let currentFrame = SKOOL_SPRITES.ostrich_climbing[frameIdx];
                    drawBitmap(ctx, o.x, o.y, currentFrame, 16, bitScale, C_CYAN);
                } else {
                    let isFacingRight = (o.facingRight !== undefined) ? o.facingRight : (o.vx >= 0);
                    let animSet = isFacingRight ? SKOOL_SPRITES.duck_right : SKOOL_SPRITES.duck_left;

                respawnInvulnerability = 90;
                if (timer <= 0) timer = 893;
                redFlashAlpha = 0.8;
                triggerShake(12, 16);
                if (lives <= 0) {
                    isGameOver = true;
                    stopBGM();
                } else {
                    player.x = isMobile ? 240 : 300; 
                    player.y = isMobile ? 712 : 436; 
                    player.vx = 0; player.vy = 0;
                    player.climbing = false;
                }

            function update() {
                updateMobileControlUI();
                if(isGameOver) return;
                if (respawnInvulnerability > 0) respawnInvulnerability--;

                if (cagedDuck.isFlying) {
                    cagedDuck.flyX += 4.5;
                    cagedDuck.flyY -= 2.2;
                }

                if (isVictory) return;
                timer -= 0.02;

                if (timer <= 0) {
                    resetLevel();
                    return;
                }

                let targetTilt = 0;
                if(player.vx > 0.5) { targetTilt = 0.16; player.facingRight = true; }
                else if(player.vx < -0.5) { targetTilt = -0.16; player.facingRight = false; }
                player.tiltAngle += (targetTilt - player.tiltAngle) * 0.25;

                let playerCenterX = player.x + player.w/2;
                let activeLadder = null;

                for(let l of ladders) {
                    let lCenterX = l.x + Math.round(10 * gfxScale);
                    if(Math.abs(playerCenterX - lCenterX) <= Math.round(18 * gfxScale) &&
                       player.y + player.h >= l.y - 4 && player.y <= l.y + l.h + 4) {
                        activeLadder = l;
                        break;
                    }
                }

                player.onLadder = activeLadder !== null;

                if (keys['ArrowDown'] && !player.climbing) {
                    for (let l of ladders) {
                        let lCenterX = l.x + Math.round(10 * gfxScale);
                        if (Math.abs(playerCenterX - lCenterX) <= Math.round(18 * gfxScale) &&
                            Math.abs((player.y + player.h) - l.y) <= 8) {
                            player.climbing = true;
                            player.x = lCenterX - player.w / 2;
                            player.y += 2;
                            activeLadder = l;
                            player.onLadder = true;
                            break;
                        }
                    }
                }

                if(player.onLadder) {
                    if(keys['ArrowUp']) {
                        player.climbing = true;
                        player.vy = -CLIMB_SPEED;
                        let lCenterX = activeLadder.x + Math.round(10 * gfxScale);
                        player.x += (lCenterX - playerCenterX) * 0.35;
                        
                        stepAudioTimer++;
                        if (stepAudioTimer % 12 === 0) playStepSound();

                        if (player.y + player.h <= activeLadder.y + 4) {
                            player.y = activeLadder.y - player.h;
                            player.climbing = false;
                            player.onGround = true;
                            player.vy = 0;
                        }

                    } else if(keys['ArrowDown']) {
                        player.climbing = true;
                        player.vy = CLIMB_SPEED;
                        let lCenterX = activeLadder.x + Math.round(10 * gfxScale);
                        player.x += (lCenterX - playerCenterX) * 0.35;

                        stepAudioTimer++;
                        if (stepAudioTimer % 12 === 0) playStepSound();

                        let bottomFloorY = isMobile ? 740 : 464;
                        if (player.y + player.h >= bottomFloorY) {
                            player.y = bottomFloorY - player.h;
                            player.climbing = false;
                            player.onGround = true;
                            player.vy = 0;
                        }
                    } else if(player.climbing) {
                        player.vy = 0;
                        if(keys['Space']) {
                            player.climbing = false;
                            player.vy = JUMP_FORCE;
                            playJumpSound();
                        }
                    }
                } else {
                    player.climbing = false;
                }

                if(keys['ArrowLeft']) {
                    player.vx = -SPEED;
                    if (player.onGround) player.climbing = false;
                } else if(keys['ArrowRight']) {
                    player.vx = SPEED;
                    if (player.onGround) player.climbing = false;
                } else {
                    player.vx *= FRICTION;
                    if(Math.abs(player.vx) < 0.05) player.vx = 0;
                }

                if (player.onGround) {
                    coyoteCounter = 8;
                } else if (coyoteCounter > 0) {
                    coyoteCounter--;
                }

                if (keys['Space']) {
                    jumpBufferCounter = 8;
                } else if (jumpBufferCounter > 0) {
                    jumpBufferCounter--;
                }

                if(!player.climbing) {
                    player.vy += GRAVITY;
                    if(jumpBufferCounter > 0 && coyoteCounter > 0) {
                        player.vy = JUMP_FORCE;
                        player.onGround = false;
                        coyoteCounter = 0;
                        jumpBufferCounter = 0;
                        playJumpSound();
                    }
                    if (!keys['Space'] && player.vy < -3) {
                        player.vy = -3;
                    }
                }

                player.x += player.vx;
                player.y += player.vy;

                if(player.x < 0) player.x = 0;
                if(player.x + player.w > canvas.width) player.x = canvas.width - player.w;
                if(player.y < 0) { player.y = 0; player.vy = 0; }

                player.onGround = false;
                let platformThickness = Math.round(16 * gfxScale);
                if(!player.climbing && player.vy >= 0) {
                    for(let p of platformData) {
                        if(player.x + player.w > p.x && player.x < p.x + p.w) {
                            if(player.y + player.h >= p.y && player.y + player.h <= p.y + platformThickness) {
                                player.y = p.y - player.h;
                                player.vy = 0; 
                                player.onGround = true;
                            }
                        }
                    }
                    for(let e of elevators) {
                        if(player.x + player.w > e.x && player.x < e.x + e.w) {
                            if(player.y + player.h >= e.y && player.y + player.h <= e.y + e.h + 4) {
                                player.y = e.y - player.h;
                                player.vy = 0; 
                                player.onGround = true;
                            }
                        }
                    }
                }

                for(let e of elevators) {
                    e.y += e.vy;
                    if(e.y <= e.minY || e.y >= e.maxY) e.vy *= -1;
                }

                // Repulsão entre avestruzes
                for (let i = 0; i < ostriches.length; i++) {
                    for (let j = i + 1; j < ostriches.length; j++) {
                        let o1 = ostriches[i];
                        let o2 = ostriches[j];
                        if (o1.platformIdx === o2.platformIdx && o1.state === 'walking' && o2.state === 'walking') {
                            if (Math.abs(o1.x - o2.x) < 28 * gfxScale) {
                                if (o1.x < o2.x) {
                                    o1.vx = -Math.abs(o1.vx);
                                    o2.vx = Math.abs(o2.vx);
                                } else {
                                    o1.vx = Math.abs(o1.vx);
                                    o2.vx = -Math.abs(o2.vx);
                                }
                                o1.climbCooldown = 25;
                                o2.climbCooldown = 25;
                            }
                        }
                    }
                }

                let sortedOstriches = ostriches.slice().sort((a, b) => {
                    let distA = Math.hypot(a.x - player.x, a.y - player.y);
                    let distB = Math.hypot(b.x - player.x, b.y - player.y);
                    return distA - distB;
                });
                let activeChasers = new Set([sortedOstriches[0], sortedOstriches[1]]);

                for(let o of ostriches) {
                    let curPlatform = platformData[o.platformIdx || 0];

                    if (o.eatingTimer > 0) {
                        o.eatingTimer--;
                        continue;
                    }

                    for(let s of seeds) {
                        if(!s.collected && Math.abs(o.x - s.x) < 14 && Math.abs((o.y + o.h) - (s.baseY + s.h)) < 14) {
                            s.collected = true;
                            o.eatingTimer = 150;
                            addFloatingText('NOM!', s.x, s.baseY - 10);
                            playTone(440, 0.1, 'sine', 0.05);
                            break;
                        }
                    }

                    if (o.climbCooldown > 0) {
                        o.climbCooldown--;
                    }

                    if (o.state === 'climbing') {
                        o.tiltAngle = 0;
                        o.y += o.vy;
                        if ((o.vy < 0 && o.y <= o.targetY) || (o.vy > 0 && o.y >= o.targetY)) {
                            o.y = o.targetY;
                            o.state = 'patrolling';
                            o.vy = 0;
                            o.facingRight = Math.random() > 0.5;
                            o.vx = o.facingRight ? 0.3 : -0.3;
                            o.climbCooldown = 40;
                            if (o.targetPlatformIdx !== undefined) {
                                o.platformIdx = o.targetPlatformIdx;
                            }
                        }
                    } else if (o.state === 'hesitating') {
                        o.vx = 0;
                        o.tiltAngle = 0;
                        o.hesitationTimer = (o.hesitationTimer || 0) - 1;
                        if (o.hesitationTimer <= 0 && o.pendingLadder) {
                            o.state = 'climbing';
                            o.x = o.pendingLadder.x;
                            o.vy = o.pendingLadder.vy;
                            o.targetY = o.pendingLadder.targetY;
                            o.targetPlatformIdx = o.pendingLadder.targetPlatformIdx;
                            o.pendingLadder = null;
                        }
                    } else if (o.state === 'turning') {
                        o.turnTimer = (o.turnTimer || 0) - 1;
                        o.vx *= 0.5;
                        o.tiltAngle = (o.tiltAngle || 0) * 0.5;
                        if (o.turnTimer <= 0) {
                            o.facingRight = !!o.targetFacingRight;
                            o.vx = o.facingRight ? 0.2 : -0.2;
                            o.state = 'patrolling';
                        }
                    } else if (o.state === 'pausing') {
                        o.pauseTimer = (o.pauseTimer || 0) - 1;
                        o.vx *= 0.6;
                        o.tiltAngle = (o.tiltAngle || 0) * 0.6;
                        if (o.pauseTimer <= 0) {
                            o.state = 'patrolling';
                        }
                    } else {
                        o.y = curPlatform.y - o.h;
                        
                        if (o.facingRight === undefined) o.facingRight = (o.vx >= 0);

                        o.walkCycleTimer = (o.walkCycleTimer || 0) - 1;
                        if (o.walkCycleTimer <= 0) {
                            o.speedMult = 0.95 + Math.random() * 0.10;
                            o.walkCycleTimer = Math.floor(Math.random() * 7) + 12;
                        }
                        
                        let baseSpeed = (o.facingRight ? 1.0 : -1.0) * (o.speedMult || 1.0);
                        o.vx += (baseSpeed - o.vx) * 0.15;
                        o.x += o.vx;

                        let targetTilt = (o.vx > 0 ? 0.08 : -0.08) * Math.min(1.0, Math.abs(o.vx));
                        o.tiltAngle = (o.tiltAngle || 0) + (targetTilt - (o.tiltAngle || 0)) * 0.2;

                        let pMinX = curPlatform.x;
                        let pMaxX = curPlatform.x + curPlatform.w - o.w;

                        let isAtEdge = (o.vx > 0 && o.x >= pMaxX) || (o.vx < 0 && o.x <= pMinX);
                        let oCenterX = o.x + o.w / 2;

                        o.targetUpdateTimer = (o.targetUpdateTimer || 0) - 1;

                        function isDecisionNode(ostrich, plat) {
                            if (ostrich.x <= plat.x || ostrich.x >= plat.x + plat.w - ostrich.w) return true;
                            let cx = ostrich.x + ostrich.w / 2;
                            for (let l of ladders) {
                                if (Math.abs(cx - (l.x + 10 * gfxScale)) < 6) return true;
                            }
                            return false;
                        }

                        if (o.targetUpdateTimer <= 0 && isDecisionNode(o, curPlatform)) {
                            o.targetUpdateTimer = Math.floor(Math.random() * 10) + 9;

                            if (o.climbCooldown <= 0) {
                                for(let lIdx = 0; lIdx < ladders.length; lIdx++) {
                                    let l = ladders[lIdx];
                                    let ladderCenterX = l.x + 10 * gfxScale;
                                    
                                    if (Math.abs(oCenterX - ladderCenterX) < 6) {
                                        let wantUp = player.y < o.y - 15;
                                        let wantDown = player.y > o.y + 15;
                                        
                                        let chaseChance = (activeChasers.has(o) ? 0.80 : 0.20);
                                        let shouldChase = (Math.random() < chaseChance);

                                        if ((wantUp || wantDown) && shouldChase) {
                                            for(let pIdx = 0; pIdx < platformData.length; pIdx++) {
                                                let p = platformData[pIdx];
                                                if (pIdx !== o.platformIdx) {
                                                    let canUp = wantUp && p.y < curPlatform.y && Math.abs((l.y + l.h) - curPlatform.y) < 20 && Math.abs(l.y - p.y) < 20;
                                                    let canDown = wantDown && p.y > curPlatform.y && Math.abs(l.y - curPlatform.y) < 20 && Math.abs((l.y + l.h) - p.y) < 20;
                                                    
                                                    if (canUp || canDown) {
                                                        o.state = 'hesitating';
                                                        o.hesitationTimer = Math.floor(Math.random() * 5) + 6;
                                                        o.pendingLadder = {
                                                            x: ladderCenterX - o.w / 2,
                                                            vy: canUp ? -1.2 : 1.2,
                                                            targetY: p.y - o.h,
                                                            targetPlatformIdx: pIdx
                                                        };
                                                        break;
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }

                        if (isAtEdge && o.state === 'patrolling') {
                            o.x = Math.max(pMinX, Math.min(pMaxX, o.x));
                            o.state = 'turning';
                            o.targetFacingRight = !o.facingRight;
                            o.turnTimer = 8;
                        } else if (Math.random() < 0.0015 && o.climbCooldown <= 0 && o.state === 'patrolling') {
                            o.state = 'pausing';
                            o.pauseTimer = 18;
                        }
                    }

                    if(o.eatingTimer <= 0 && player.x < o.x + o.w && player.x + player.w > o.x &&
                       player.y < o.y + o.h && player.y + player.h > o.y) {
                        resetLevel();
                    }
                }

                let eggsLeft = 0;
                for(let egg of eggs) {
                    if(!egg.collected) {
                        let bobOffset = Math.sin(Date.now() * 0.008 + egg.x) * 3.5;
                        let currentEggY = egg.baseY + bobOffset;

                        if(player.x < egg.x + egg.w && player.x + player.w > egg.x &&
                           player.y < currentEggY + egg.h && player.y + player.h > currentEggY) {
                            egg.collected = true; score += 100;
                            playEggSound();
                            addParticles(egg.x + 7, currentEggY + 6);
                            addFloatingText('+100', egg.x, currentEggY - 10);
                        } else { eggsLeft++; }
                    }
                }

                for(let s of seeds) {
                    if(!s.collected) {
                        if(player.x < s.x + s.w && player.x + player.w > s.x &&
                           player.y < s.baseY + s.h && player.y + player.h > s.baseY) {
                            s.collected = true; score += 50; timer += 40;
                            playEggSound();
                            addFloatingText('+50', s.x, s.baseY - 10);
                        }
                    }
                }

                if(eggsLeft === 0 && !isVictory) {
                    isVictory = true;
                    victoryTimer = 0;
                    cagedDuck.isFlying = true;
                    playWinSound();
                    triggerShake(8, 20);
                }
            }

            function draw() {
                ctx.save();
                
                if(shakeTime > 0) {
                    let rx = (Math.random() - 0.5) * shakeIntensity;
                    let ry = (Math.random() - 0.5) * shakeIntensity;
                    ctx.translate(rx, ry);
                    shakeTime--;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for(let p of platformData) {
                    if (!p.hidden) drawPlatform(p.x, p.y, p.w);
                }
                
                for(let l of ladders) drawLadder(l.x, l.y, l.h);
                
                for(let e of elevators) {
                    ctx.fillStyle = C_YELLOW; ctx.fillRect(e.x, e.y, e.w, e.h);
                }

                for(let s of seeds) {
                    if(!s.collected) {
                        drawBitmap(ctx, s.x, s.baseY, SKOOL_SPRITES.corn, 8, gfxScale * 1.5, C_MAGENTA);
                    }
                }

                for(let egg of eggs) {
                    if(!egg.collected) {
                        let bobOffset = Math.sin(Date.now() * 0.008 + egg.x) * 3.5;
                        let renderY = egg.baseY + bobOffset;
                        drawBitmap(ctx, egg.x, renderY, SKOOL_SPRITES.egg, 8, gfxScale * 1.5, C_WHITE);
                    }
                }

                for(let o of ostriches) drawOstrich(o);
                if(!isGameOver && !isVictory && (respawnInvulnerability <= 0 || Math.floor(respawnInvulnerability/6)%2===0)) drawPlayer();

                for(let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life--;
                    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, Math.max(2, Math.round(3*gfxScale)), Math.max(2, Math.round(3*gfxScale)));
                    if(p.life <= 0) particles.splice(i, 1);
                }

                ctx.font = 'bold 10px "Press Start 2P", "Courier New", monospace';
                for(let i = floatingTexts.length - 1; i >= 0; i--) {
                    let ft = floatingTexts[i];
                    ft.y -= 0.8; ft.life--;
                    ctx.fillStyle = C_YELLOW; ctx.fillText(ft.text, ft.x, ft.y);
                    if(ft.life <= 0) floatingTexts.splice(i, 1);
                }

                drawUI();

                ctx.fillStyle = '#999999';
                ctx.font = '10px "Press Start 2P", "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Setas (Mover / Escadas) • Barra de Espaço (Salto)', canvas.width / 2, canvas.height - 15);
                ctx.textAlign = 'left';

                if(redFlashAlpha > 0) {
                    ctx.fillStyle = `rgba(255, 0, 0, ${redFlashAlpha})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    redFlashAlpha -= 0.05;
                }

                if(isGameOver) {
                    let boxW = 340, boxH = 110;
                    let vx = (canvas.width / 2) - (boxW / 2);
                    let vy = (canvas.height / 2) - (boxH / 2);

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(vx + 5, vy + 5, boxW, boxH);
                    ctx.strokeStyle = '#FF00FF';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(vx + 5, vy + 5, boxW, boxH);

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(vx, vy, boxW, boxH);
                    ctx.strokeStyle = C_CYAN;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(vx, vy, boxW, boxH);

                    ctx.textAlign = 'center';
                    let blink = Math.floor(Date.now() / 250) % 2 === 0;
                    ctx.fillStyle = blink ? C_YELLOW : C_RED;
                    ctx.font = 'bold 18px "Press Start 2P", "Courier New", monospace';
                    ctx.fillText('GAME OVER', vx + (boxW / 2), vy + 45);

                    ctx.fillStyle = C_CYAN;
                    ctx.font = 'bold 10px "Press Start 2P", "Courier New", monospace';
                    ctx.fillText('CLICA PARA REINICIAR', vx + (boxW / 2), vy + 78);
                    ctx.textAlign = 'left';
                }

                if(isVictory) {
                    victoryTimer++;
                    const retroColors = [C_RED, C_GREEN, C_YELLOW, C_CYAN, C_MAGENTA];
                    ctx.fillStyle = retroColors[victoryTimer % retroColors.length];
                    
                    let vx = (canvas.width / 2) - 160;
                    let vy = (canvas.height / 2) - 50;
                    ctx.fillRect(vx, vy, 320, 100);
                    
                    ctx.fillStyle = '#000000';
                    ctx.font = '12px "Press Start 2P", "Courier New", monospace';
                    ctx.fillText('NÍVEL CONCLUÍDO!', vx + 40, vy + 55);

                    if(victoryTimer > 90) {
                        transitionToVideo();
                    }
                }

                ctx.restore();
            }

            // LOOP A 60 FPS COM TIMESTEP FIXO
            let lastTime = 0;
            const TIME_STEP = 1000 / 60;
            let accumulator = 0;

            function loop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let deltaTime = timestamp - lastTime;
                lastTime = timestamp;

                if (deltaTime > 100) deltaTime = 100;
                accumulator += deltaTime;

                while (accumulator >= TIME_STEP) {
                    update();
                    accumulator -= TIME_STEP;
                }

                draw();

                const overlay = document.getElementById('game-overlay');
                if(overlay && !overlay.classList.contains('game-hidden')) {
                    animationFrameId = requestAnimationFrame(loop);
                }
            }
            
            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(loop);
        }


</script></body></html>
