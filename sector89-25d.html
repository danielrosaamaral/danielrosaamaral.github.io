<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10161b"><title>Sector 89 — teste 2,5D</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0f14;color:#e8e2d0;font-family:Arial,sans-serif}body{display:grid;place-items:center;min-width:1000px;min-height:760px}.wrap{width:980px}.head,.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#9ca5a4;font:11px/1.5 monospace;letter-spacing:.13em}.head{margin:0 4px 9px}.head b{color:#dfc774}.frame{padding:7px;background:#343a40;border:2px solid #a7a497;box-shadow:0 0 0 5px #20242a,0 18px 52px #000}.screen{width:960px;height:540px;position:relative;overflow:hidden;background:#71858b}.screen canvas{display:block;width:960px;height:540px}.hud{position:absolute;z-index:2;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none;font:600 12px monospace;letter-spacing:.12em;color:#f0ead7;text-shadow:0 1px 5px #071016}.hud span{padding:8px 10px;background:rgba(9,18,23,.65);border-left:2px solid #dfc25d}.hud span:last-child{text-align:right;border-left:0;border-right:2px solid #dfc25d}.hud b{display:block;color:#f0d779;margin-top:3px}.foot{margin:16px 4px 0;font-size:10px}.desk{display:none;position:fixed;inset:0;z-index:5;background:#0c131a;color:#f1e8d0;place-items:center;text-align:center;padding:30px;font:16px/1.6 Arial}.desk div{max-width:460px;padding:28px;border:1px solid #bca75d;background:#161e24}.desk b{display:block;color:#e4cb70;margin-bottom:8px;font-size:20px}@media(max-width:999px){.desk{display:grid}}
</style></head><body><div class="desk"><div><b>Teste visual 2,5D — desktop</b>Abre num ecrã maior para veres a composição completa.</div></div><main class="wrap"><header class="head"><span><b>SECTOR 89</b>　/　TESTE VISUAL 2,5D</span><span>CIRCUITO NEVADA　·　DESKTOP</span></header><div class="frame"><section class="screen"><canvas id="scene" width="960" height="540" aria-label="Teste visual 2,5D: pista ilustrada com perspectiva, três carros sprites a aproximarem-se e cockpit detalhado em primeiro plano"></canvas><div class="hud"><span>HULL INTEGRITY<b>94%</b></span><span>WEAPON SYSTEM<b>MISSILE POD · 04</b></span></div></section></div><footer class="foot"><span>ESTRADA EM PERSPECTIVA · SPRITES ESCALÁVEIS · COCKPIT FIXO</span><span>PROVA DE ARTE — SEM CONDUÇÃO</span></footer></main><script>
(()=>{'use strict';const c=document.querySelector('#scene'),x=c.getContext('2d'),W=960,H=540,bg=new Image(),cock=new Image(),cars=[new Image(),new Image(),new Image()];bg.src='track-background.png';cock.src='cockpit-2.png';cars[0].src='foe-1.png';cars[1].src='foe-2.png';cars[2].src='foe-3.png';let start=performance.now(),last=0;
function draw(now){let t=(now-start)/1000,dt=Math.min(.05,(now-last)/1000);last=now;x.clearRect(0,0,W,H);
// Single detailed pre-rendered 2.5D track plate, gently animated for forward travel.
if(bg.complete&&bg.naturalWidth){let shift=Math.sin(t*.22)*4;x.drawImage(bg,0,0,bg.naturalWidth,bg.naturalHeight,shift,0,W,H)}else{let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#abc8ca');g.addColorStop(.52,'#977758');g.addColorStop(1,'#2d3030');x.fillStyle=g;x.fillRect(0,0,W,H)}
// dimensional approach: independent rear-view racers increase in scale as they approach.
const phase=(t*.115)%1;const racers=[{img:cars[2],x:333+Math.sin(t*.8)*5,far:251,near:410,base:120,w:44,nearW:235},{img:cars[1],x:608+Math.sin(t*.64+1)*7,far:239,near:381,base:73,nearW:172},{img:cars[0],x:735+Math.sin(t*.58+2)*6,far:227,near:355,base:57,nearW:130}];
// add simple streaks at frame edges as the track moves past
x.save();x.globalAlpha=.28;for(let i=0;i<16;i++){let y=270+((i*41+t*115)%210),q=(y-270)/210,side=i%2?1:-1,xx=480+side*(390+q*90);x.fillStyle=i%3?'#f4ddb3':'#fff';x.fillRect(xx,y,3+q*11,1+q*2)}x.restore();
for(const a of racers){let p=(phase+(a.far-227)/250)%1,base=a.far+p*(a.near-a.far),w=a.base+p*(a.nearW-a.base),h=w*.99,cx=a.x+(a.x<480?-1:1)*p*18;let shadowW=w*.56;x.save();x.globalAlpha=.32;x.fillStyle='#171612';x.beginPath();x.ellipse(cx,base-5,shadowW,.16*w,0,0,Math.PI*2);x.fill();x.restore();let im=a.img;if(im.complete&&im.naturalWidth)x.drawImage(im,cx-w/2,base-h,w,h);else{ x.fillStyle='#aa4238';x.fillRect(cx-w/2,base-h*.6,w,h*.6)}}
// gentle dust flashes near road edge, held behind foreground cockpit
x.save();x.globalAlpha=.15+.08*Math.sin(t*2);x.fillStyle='#f2cea1';x.filter='blur(10px)';x.beginPath();x.ellipse(78+Math.sin(t)*12,377,58,19,0,0,7);x.ellipse(887-Math.sin(t*.8)*15,397,41,14,0,0,7);x.fill();x.restore();
// full-width transparent, high-detail cockpit cutout above the road and cars.
if(cock.complete&&cock.naturalWidth){let ratio=H*.51/cock.naturalHeight,w=960*1.06,h=cock.naturalHeight*ratio;x.drawImage(cock,(W-w)/2,H-h+10,w,h)}else{let g=x.createLinearGradient(0,396,0,540);g.addColorStop(0,'#656a6b');g.addColorStop(.12,'#20272c');g.addColorStop(1,'#080b0f');x.fillStyle=g;x.fillRect(0,396,W,144)}
// subtle windshield frame highlights, crosshair and display glints
x.save();x.strokeStyle='rgba(236,242,225,.76)';x.lineWidth=1;x.beginPath();x.moveTo(474,230);x.lineTo(486,230);x.moveTo(480,224);x.lineTo(480,236);x.arc(480,230,5,0,7);x.stroke();x.restore();
requestAnimationFrame(draw)}requestAnimationFrame(draw)})();</script></body></html>
