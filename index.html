    <style>
        :root {
            --electric-blue-pure: rgb(0, 17, 255);
            --electric-blue-dark: rgb(0, 8, 120);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-reveal {
            opacity: 0;
            animation: fadeInUp 0.8s var(--ease-out-expo) forwards;
        }

        .delay-1 { animation-delay: 80ms; }
        .delay-2 { animation-delay: 160ms; }
        .delay-3 { animation-delay: 240ms; }
        .delay-4 { animation-delay: 320ms; }
        .delay-5 { animation-delay: 400ms; }
        .delay-6 { animation-delay: 480ms; }
        .delay-7 { animation-delay: 560ms; }

        @keyframes shimmerElectric {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-electric {
            background: linear-gradient(90deg, rgb(0, 17, 255) 0%, rgb(100, 140, 255) 50%, rgb(0, 17, 255) 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerElectric 5s linear infinite;
        }

        @keyframes electricPulse {
            0%, 100% {
                border-color: var(--electric-blue-dark);
                color: rgb(120, 150, 255);
                box-shadow: 0 0 8px rgba(0, 17, 255, 0.2);
            }
            50% {
                border-color: var(--electric-blue-pure);
                color: var(--electric-blue-pure);
                box-shadow: 0 0 22px rgba(0, 17, 255, 0.65);
            }
        }

        .btn-electric-pulse {
            animation: electricPulse 3s ease-in-out infinite;
        }

        .btn-electric-pulse:hover {
            animation: none;
            background-color: var(--electric-blue-pure);
            border-color: var(--electric-blue-pure);
            color: #000000;
            box-shadow: 0 0 30px rgba(0, 17, 255, 0.9);
        }

        @keyframes waveHand {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-14deg); }
            40% { transform: rotate(12deg); }
            60% { transform: rotate(-10deg); }
            80% { transform: rotate(8deg); }
        }

        .wave-emoji {
            display: inline-block;
            transform-origin: 70% 70%;
            animation: waveHand 2.2s infinite;
        }

        .interactive-link {
            position: relative;
            display: inline-block;
        }
        .interactive-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1px;
            bottom: -1px;
            left: 0;
            background-color: var(--electric-blue-pure);
            transform-origin: bottom right;
            transition: transform 0.35s var(--ease-out-expo);
        }
        .interactive-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        .interactive-link:hover {
            color: rgb(100, 140, 255);
        }

        .brand-item {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .brand-item.dimmed {
            opacity: 0.15;
            filter: grayscale(100%);
        }
        .brand-item.highlighted {
            opacity: 1;
            color: #ffffff;
            font-weight: 400;
        }
        .filter-btn {
            background-color: rgba(255, 255, 255, 0.02);
        }
        .filter-btn.active {
            border-color: rgb(0, 17, 255);
            color: #ffffff;
            background-color: rgba(0, 17, 255, 0.12);
        }

        #game-overlay {
            transition: opacity 0.5s ease;
            touch-action: none;
        }
        
        #chuckieCanvas {
            image-rendering: pixelated;
        }

        .touch-btn {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
