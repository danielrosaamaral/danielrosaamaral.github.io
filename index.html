    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e0e0e0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --card-bg: #171717;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif, system-ui;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.25;
            overflow-x: hidden;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modal-icon {
            margin-bottom: 1.5rem;
            display: inline-flex;
            padding: 1rem;
            background-color: rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            color: var(--accent-color);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .modal-content p {
            margin-bottom: 1.5rem;
            color: #a3a3a3;
            font-size: 0.95rem;
        }

        .modal-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .modal-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Game and Main Container Styling */
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

            <h2>Aviso de Acesso</h2>

            <button id="accept-game-btn" class="modal-btn">Aceitar & Jogar</button>
        </div>
    </div>

    <!-- Área Principal do Jogo / Aplicação -->
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

            modal.style.display = 'none';
            // Inicialização da lógica do jogo ou transição
        });
    </script>
</body>
