<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuga da Gaiola - Jogo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --cage-metal: #334155;
            --cage-base: #1e293b;
            --bird-color: #38bdf8;
            --wood-color: #b45309;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #f8fafc;
        }

        .game-stage {
            position: relative;
            width: 400px;
            height: 500px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .cage-container {
            position: relative;
            width: 180px;
            height: 260px;
        }

        /* Base da Gaiola */
        .cage-base {
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 200px;
            height: 20px;
            background-color: var(--wood-color);
            border-radius: 4px;
            z-index: 3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Escada Alinhada Corretamente com a Base */
        .ladder {
            position: absolute;
            bottom: 20px; /* Posicionada exatamente no topo da base */
            left: 30px;
            width: 30px;
            height: 160px;
            z-index: 4; /* Garante que fica à frente e não passa incorretamente por trás */
            display: flex;
            justify-content: space-between;
        }

        .ladder-rail {
            width: 4px;
            height: 100%;
            background-color: #d97706;
            border-radius: 2px;
        }

        .ladder-rungs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .rung {
            width: 100%;
            height: 4px;
            background-color: #d97706;
            border-radius: 2px;
        }

        /* Estrutura da Gaiola (Grades) */
        .cage-bars {
            position: absolute;
            top: 20px;
            left: 0;
            width: 180px;
            height: 220px;
            border: 4px solid var(--cage-metal);
            border-top: 20px solid var(--cage-metal);
            border-radius: 90px 90px 0 0;
            z-index: 2;
            box-sizing: border-box;
        }

        /* Micro-Animação do Pássaro em Cativeiro (Idle Ativo) */
        @keyframes cage-idle {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-1.5deg); }
            100% { transform: translateY(0) rotate(1.5deg); }
        }

        .bird {
            position: absolute;
            bottom: 35px;
            left: 70px;
            width: 40px;
            height: 30px;
            background-color: var(--bird-color);
            border-radius: 50% 50% 40% 40%;
            z-index: 2;
            transform-origin: center bottom;
            animation: cage-idle 3s ease-in-out infinite;
        }

        .bird::before {
            content: '';
            position: absolute;
            right: -6px;
            top: 10px;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 8px solid #fbbf24;
        }

        .bird::after {
            content: '';
            position: absolute;
            right: 10px;
            top: 8px;
            width: 4px;
            height: 4px;
            background-color: #0f172a;
            border-radius: 50%;
        }

        /* Animação de Fuga (Fim de Jogo) */
        @keyframes bird-escape {
            0% { 
                transform: translate(0, 0) scale(1) rotate(0deg); 
                opacity: 1; 
            }
            30% { 
                transform: translate(-20px, -40px) scale(1.05) rotate(-10deg); 
            }
            100% { 
                transform: translate(180px, -220px) scale(0.9) rotate(15deg); 
                opacity: 0; 
            }
        }

        .game-stage.game-over .bird {
            animation: bird-escape 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 10;
        }

        .game-stage.game-over .cage-bars {
            border-color: #64748b;
            transition: transform 0.5s ease;
            transform: rotateY(45deg);
            transform-origin: left;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="game-stage" id="gameStage">
        <div class="cage-container">
            <!-- Escada alinhada corretamente com a base -->
            <div class="ladder">
                <div class="ladder-rail"></div>
                <div class="ladder-rungs">
                    <div class="rung"></div>
                    <div class="rung"></div>
                    <div class="rung"></div>
                    <div class="rung"></div>
                    <div class="rung"></div>
                </div>
                <div class="ladder-rail"></div>
            </div>

            <!-- Estrutura da Gaiola -->
            <div class="cage-bars"></div>
            
            <!-- Pássaro com micro-animação ativa -->
            <div class="bird" id="bird"></div>

            <!-- Base da Gaiola -->
            <div class="cage-base"></div>
        </div>
    </div>

    <div class="controls">
        <button id="triggerBtn">Terminar Jogo / Libertar Pássaro</button>
    </div>

    <script>
        const stage = document.getElementById('gameStage');
        const triggerBtn = document.getElementById('triggerBtn');

        triggerBtn.addEventListener('click', () => {
            stage.classList.toggle('game-over');
            if (stage.classList.contains('game-over')) {
                triggerBtn.textContent = 'Reiniciar Jogo';
            } else {
                triggerBtn.textContent = 'Terminar Jogo / Libertar Pássaro';
            }
        });
    </script>
</body>
</html>
