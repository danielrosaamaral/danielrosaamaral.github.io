<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuckie Engine - Produção</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0f;
            color: #f1f1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            background-color: #121218;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// CONFIGURAÇÃO E INICIALIZAÇÃO DO MOTOR
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const VIRTUAL_WIDTH = 800;
const VIRTUAL_HEIGHT = 600;

canvas.width = VIRTUAL_WIDTH;
canvas.height = VIRTUAL_HEIGHT;

const game = {
    lastTime: 0,
    scale: 1
};

// ==========================================
// GESTÃO DE INPUT (TECLADO)
// ==========================================
const input = {
    left: false,
    right: false,
    up: false,
    down: false,
    jump: false
};

window.addEventListener('keydown', e => handleKey(e, true));
window.addEventListener('keyup', e => handleKey(e, false));

function handleKey(e, isDown) {
    switch(e.code) {
        case 'ArrowLeft':
        case 'KeyA':
            input.left = isDown;
            break;
        case 'ArrowRight':
        case 'KeyD':
            input.right = isDown;
            break;
        case 'ArrowUp':
        case 'KeyW':
            input.up = isDown;
            break;
        case 'ArrowDown':
        case 'KeyS':
            input.down = isDown;
            break;
        case 'Space':
            input.jump = isDown;
            break;
    }
}

// ==========================================
// UTILITÁRIO DE FEEDBACK HÁPTICO SEGURO
// ==========================================
function triggerHaptic(pattern) {
    if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
        try {
            navigator.vibrate(pattern);
        } catch (e) {
            // Ignora falhas em ambientes restritos (ex: iOS Safari)
        }
    }
}

// ==========================================
// ESTADO DAS ENTIDADES DO JOGO
// ==========================================
const player = {
    x: 100,
    y: 100,
    width: 24,
    height: 32,
    vx: 0,
    vy: 0,
    speed: 220,     // Pixéis por segundo
    gravity: 850,   // Pixéis por segundo ao quadrado
    onGround: false,
    onLadder: false,
    activePlatform: null
};

const platforms = [
    { x: 50, y: 500, width: 700, height: 20 },
    { x: 200, y: 380, width: 200, height: 16 },
    { x: 450, y: 260, width: 200, height: 16 }
];

const ladders = [
    { x: 350, y: 260, width: 24, height: 240 }
];

const elevators = [
    { x: 100, y: 400, width: 80, height: 16, minY: 200, maxY: 480, vy: 60, direction: 1 }
];

// ==========================================
// REDIMENSIONAMENTO DINÂMICO RESPONSIVO
// ==========================================
function resizeCanvas() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    const scaleX = windowWidth / VIRTUAL_WIDTH;
    const scaleY = windowHeight / VIRTUAL_HEIGHT;
    
    game.scale = Math.min(scaleX, scaleY);
    
    canvas.style.width = `${VIRTUAL_WIDTH * game.scale}px`;
    canvas.style.height = `${VIRTUAL_HEIGHT * game.scale}px`;
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
resizeCanvas();

// ==========================================
// DETEÇÃO DE COLISÕES AABB
// ==========================================
function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// ==========================================
// CICLO DE ATUALIZAÇÃO (FÍSICA E LÓGICA)
// ==========================================
function update(dt) {
    // 1. Atualização de Elevadores Móveis
    elevators.forEach(e => {
        e.y += e.vy * e.direction * dt;
        if (e.y <= e.minY || e.y >= e.maxY) {
            e.direction *= -1;
        }
    });

    // 2. Verificação de Escadas
    player.onLadder = false;
    ladders.forEach(l => {
        if (checkCollision(player, l)) {
            player.onLadder = true;
        }
    });

    // 3. Movimento Horizontal
    player.vx = 0;
    if (input.left) player.vx = -player.speed;
    if (input.right) player.vx = player.speed;

    player.x += player.vx * dt;

    // 4. Física Vertical (Escadas, Elevadores e Gravidade)
    if (player.onLadder) {
        player.activePlatform = null;
        if (input.up) {
            player.vy = -player.speed * 0.8;
        } else if (input.down) {
            player.vy = player.speed * 0.8;
        } else {
            // Deslizamento controlado em vez de congelamento estático
            player.vy = 40; 
        }
    } else {
        let ridingElevator = null;
        elevators.forEach(e => {
            const playerFeet = { 
                x: player.x, 
                y: player.y + player.height, 
                width: player.width, 
                height: 2 
            };
            if (checkCollision(playerFeet, e) && player.vy >= 0) {
                ridingElevator = e;
            }
        });

        if (ridingElevator) {
            player.activePlatform = ridingElevator;
            player.y = ridingElevator.y - player.height;
            player.vy = ridingElevator.vy * ridingElevator.direction;
            player.onGround = true;
        } else {
            player.activePlatform = null;
            player.vy += player.gravity * dt;
            player.onGround = false;
        }
    }

    player.y += player.vy * dt;

    // 5. Colisão com Plataformas Estáticas
    platforms.forEach(p => {
        if (checkCollision(player, p)) {
            if (player.vy > 0 && (player.y + player.height - player.vy * dt) <= p.y) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.onGround = true;
            }
        }
    });

    // 6. Restrições de Limites do Ecrã
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > VIRTUAL_WIDTH) player.x = VIRTUAL_WIDTH - player.width;
    
    // Queda fora do mapa (Reset)
    if (player.y > VIRTUAL_HEIGHT) {
        player.x = 100;
        player.y = 100;
        player.vy = 0;
        triggerHaptic(150);
    }
}

// ==========================================
// CICLO DE RENDERIZAÇÃO GRÁFICA
// ==========================================
function render() {
    ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

    // Plataformas
    ctx.fillStyle = '#2a2a3c';
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
    });

    // Escadas
    ctx.fillStyle = '#3a3a52';
    ladders.forEach(l => {
        ctx.fillRect(l.x + l.width / 2 - 4, l.y, 8, l.height);
    });

    // Elevadores
    ctx.fillStyle = '#4e4e7c';
    elevators.forEach(e => {
        ctx.fillRect(e.x, e.y, e.width, e.height);
    });

    // Jogador
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(player.x, player.y, player.width, player.height);
}

// ==========================================
// LOOP PRINCIPAL DO MOTOR DE JOGO
// ==========================================
function gameLoop(timestamp) {
    if (!game.lastTime) game.lastTime = timestamp;
    const dt = Math.min((timestamp - game.lastTime) / 1000, 0.1);
    game.lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

// Arranque do motor
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
